name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: python

      - name: Coletar dados e gerar public/data.json
        run: ./atualizar.sh

      # O push dispara o deploy na Vercel pela integração Git.
      - name: Commit dos dados novos
        run: |
          git add -A dados public
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dados ($(date -u +%Y-%m-%d))"
          git push
